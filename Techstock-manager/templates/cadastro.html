{% extends "base.html" %}

{% block conteudo %}

<section class="titulo-pagina">
    <h2>Cadastrar Novo Produto</h2>
    <p>Preencha os dados do produto ou licença.</p>
</section>

<form method="POST" class="formulario">

    <label>SKU / Código do produto *</label>
    <input type="text" name="sku" required>

    <label>Nome comercial *</label>
    <input type="text" name="nome" required>

    <label>Fabricante *</label>
    <input type="text" name="fabricante" required>

    <label>Classificação *</label>
    <select name="classificacao" required>
        <option value="">Selecione</option>
        <option value="Hardware">Hardware</option>
        <option value="Software">Software</option>
        <option value="Periferico">Periférico</option>
    </select>

    <label>Especificação técnica / versão</label>
    <textarea name="especificacao"></textarea>

    <label>Modalidade de licenciamento</label>
    <select name="modalidade">
        <option value="">Não se aplica</option>
        <option value="Assinatura Anual">Assinatura Anual</option>
        <option value="Perpétua/ESD">Perpétua/ESD</option>
        <option value="OEM">OEM</option>
    </select>

    <label>Valor unitário (R$) *</label>
    <input type="number" name="valor" step="0.01" min="0.01" required>

    <label>Quantidade em estoque *</label>
    <input type="number" name="estoque" min="0" required>

    <label>Estoque mínimo *</label>
    <input type="number" name="estoque_minimo" min="0" required>

    <label>Localização física / digital</label>
    <input type="text" name="localizacao">

    <label>Categoria *</label>
    <select name="categoria_id" required>
        <option value="">Selecione uma categoria</option>

        {% for categoria in categorias %}
            <option value="{{ categoria.id }}">
                {{ categoria.nome }}
            </option>
        {% endfor %}
    </select>

    <label>Fornecedor *</label>
    <select name="fornecedor_id" required>
        <option value="">Selecione um fornecedor</option>

        {% for fornecedor in fornecedores %}
            <option value="{{ fornecedor.id }}">
                {{ fornecedor.razao_social }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="botao">
        Salvar Produto
    </button>

</form>

{% endblock %}
