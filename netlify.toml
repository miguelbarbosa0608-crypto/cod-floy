# Configuração de deploy na Netlify (TanStack Start + @netlify/vite-plugin-tanstack-start).
# Documentação: https://docs.netlify.com/build/frameworks/framework-setup-guides/tanstack-start/
[build]
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

[dev]
  command = "npm run dev"
  port = 8080
